name: Snatcher Engine CI & Build

on:
  push:
    branches: [ snatcher, main ]
  pull_request:
    branches: [ snatcher, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libpng-dev libogg-dev \
            libvorbis-dev libflac-dev zlib1g-dev libmad0-dev libtheora-dev

      - name: Configure ScummVM (Snatcher Engine)
        run: |
          ./configure --disable-all-engines --enable-engine=snatcher --enable-release

      - name: Compile
        run: |
          make -j$(nproc)

      - name: Strip binary
        run: |
          strip scummvm

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-snatcher-linux-x86_64
          path: scummvm
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android build configuration
        run: |
          echo "srcdir=$(pwd)" > dists/android/src.properties
          mkdir -p dists/android/mainAssets/src/main/assets
          touch dists/android/mainAssets/src/main/assets/MD5SUMS
          cp dists/android/mainAssets.gradle dists/android/mainAssets/build.gradle
          mkdir -p dists/android/build/intermediates

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd dists/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-snatcher-android-debug-apk
          path: dists/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
