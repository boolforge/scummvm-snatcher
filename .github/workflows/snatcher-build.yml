name: Snatcher Engine CI & Build

on:
  push:
    branches: [ snatcher, main ]
  pull_request:
    branches: [ snatcher, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libpng-dev libogg-dev \
            libvorbis-dev libflac-dev zlib1g-dev libmad0-dev libtheora-dev

      - name: Configure ScummVM (Snatcher Engine)
        run: |
          ./configure --disable-all-engines --enable-engine=snatcher --enable-release

      - name: Compile
        run: |
          make -j$(nproc)

      - name: Strip binary
        run: |
          strip scummvm

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-snatcher-linux-x86_64
          path: scummvm
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: '23.2.8568313'
          link-to-sdk: true

      - name: Configure ScummVM Android ARM64
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          ./configure --host=android-arm64-v8a --enable-engine=snatcher --enable-release

      - name: Compile Native ScummVM Engine & APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          make -j$(nproc)
          make ScummVM-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-snatcher-android-debug-apk
          path: ScummVM-debug.apk
          if-no-files-found: error

